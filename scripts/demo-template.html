<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>purifytrace — DOMPurify sanitization audit trail</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16181d;
        --panel: #1e2128;
        --panel-2: #262a33;
        --line: #343945;
        --text: #e6e8ec;
        --muted: #9aa3b2;
        --accent: #7aa2f7;
        --high: #f7768e;
        --medium: #e0af68;
        --low: #7dcfff;
        --ok: #9ece6a;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      header {
        border-bottom: 1px solid var(--line);
        padding: 28px 32px 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: baseline;
      }
      h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
      h1 span { color: var(--accent); }
      .sub { color: var(--muted); font-size: 13px; }
      main { padding: 24px 32px 60px; display: grid; grid-template-columns: 280px 1fr; gap: 24px; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
      .sidebar { position: sticky; top: 16px; align-self: start; max-height: 80vh; overflow: auto; }
      .search {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .filelist { list-style: none; margin: 0; padding: 0; }
      .filelist button {
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-left: 2px solid transparent;
        color: var(--muted);
        padding: 5px 8px;
        font: 12px/1.4 var(--mono);
        cursor: pointer;
        border-radius: 0 6px 6px 0;
      }
      .filelist button:hover { background: var(--panel); color: var(--text); }
      .filelist button.active { background: var(--panel-2); color: var(--text); border-left-color: var(--accent); }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
      .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
      pre { margin: 0; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
      .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
      .tabs button {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .tabs button.active { background: var(--panel-2); color: var(--text); border-color: var(--accent); }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; }
      td.mono { font-family: var(--mono); font-size: 12px; }
      .tag {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 11px;
        font-family: var(--mono);
        border: 1px solid var(--line);
      }
      .tag.high { color: var(--high); border-color: color-mix(in srgb, var(--high) 45%, transparent); }
      .tag.medium { color: var(--medium); border-color: color-mix(in srgb, var(--medium) 45%, transparent); }
      .tag.low { color: var(--low); border-color: color-mix(in srgb, var(--low) 45%, transparent); }
      .tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
      .tag.confirmed { color: var(--ok); }
      .tag.inferred { color: var(--medium); }
      .muted { color: var(--muted); }
      .stat-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
      .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 92px; }
      .stat b { display: block; font-size: 17px; font-weight: 600; }
      .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .banner { border-left: 3px solid var(--medium); background: color-mix(in srgb, var(--medium) 9%, transparent); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 13px; margin-bottom: 14px; }
      .banner b { color: var(--medium); }
      footer { border-top: 1px solid var(--line); padding: 18px 32px 40px; color: var(--muted); font-size: 12.5px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <h1>purify<span>trace</span></h1>
      <div class="sub" id="meta"></div>
    </header>
    <main>
      <aside class="sidebar">
        <input class="search" id="search" placeholder="filter payloads…" />
        <ul class="filelist" id="filelist"></ul>
      </aside>
      <section id="content"></section>
    </main>
    <footer>
      Offline demo — the audit data is pre-computed at build time (<code>npm run demo</code>).
      No network requests, no runtime dependency.
    </footer>
    <script src="data.js"></script>
    <script>
      const DATA = window.PURIFYTRACE_DATA;
      let currentFile = DATA.entries[0].file;
      let currentConfig = DATA.configs[0];

      const el = (tag, cls, text) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      document.getElementById('meta').textContent =
        `DOMPurify ${DATA.dompurify} · purifytrace ${DATA.purifytrace} · ${DATA.entries.length} payloads`;

      function renderList(filter) {
        const list = document.getElementById('filelist');
        list.innerHTML = '';
        for (const entry of DATA.entries) {
          if (filter && !entry.file.includes(filter) && !entry.input.includes(filter)) continue;
          const li = document.createElement('li');
          const button = el('button', entry.file === currentFile ? 'active' : '', entry.file);
          button.onclick = () => {
            currentFile = entry.file;
            renderList(document.getElementById('search').value);
            renderContent();
          };
          li.appendChild(button);
          list.appendChild(li);
        }
      }

      function renderContent() {
        const entry = DATA.entries.find((item) => item.file === currentFile);
        const result = entry.configs[currentConfig];
        const content = document.getElementById('content');
        content.innerHTML = '';

        const tabs = el('div', 'tabs');
        for (const config of DATA.configs) {
          const button = el('button', config === currentConfig ? 'active' : '', config);
          button.onclick = () => {
            currentConfig = config;
            renderContent();
          };
          tabs.appendChild(button);
        }
        content.appendChild(tabs);

        const stats = el('div', 'stat-row');
        const stat = (value, label) => {
          const box = el('div', 'stat');
          box.appendChild(el('b', '', String(value)));
          box.appendChild(el('span', '', label));
          stats.appendChild(box);
        };
        stat(result.events.length, 'events');
        stat(result.findings.length, 'findings');
        stat(result.upstreamRecords, 'upstream records');
        stat(result.upstreamMismatch, 'mismatch');
        stat(result.stats.bytesIn, 'bytes in');
        stat(result.stats.bytesOut, 'bytes out');
        content.appendChild(stats);

        if (result.headIgnored.length > 0) {
          const banner = el('div', 'banner');
          banner.appendChild(el('b', '', 'pre-walk loss: '));
          banner.appendChild(
            document.createTextNode(
              `the HTML parser moved ${result.headIgnored.map((item) => '<' + item.tag + '>').join(', ')} into <head> before DOMPurify ran — DOMPurify.removed stays empty, purifytrace reports it`
            )
          );
          content.appendChild(banner);
        }

        const inputPanel = el('div', 'panel');
        inputPanel.appendChild(el('h2', '', 'input'));
        inputPanel.appendChild(el('pre', '', entry.input));
        content.appendChild(inputPanel);

        const outputPanel = el('div', 'panel');
        outputPanel.appendChild(el('h2', '', 'output'));
        outputPanel.appendChild(el('pre', '', result.output || '(empty)'));
        content.appendChild(outputPanel);

        const eventsPanel = el('div', 'panel');
        eventsPanel.appendChild(el('h2', '', `audit events (${result.events.length})`));
        if (result.events.length === 0) {
          eventsPanel.appendChild(el('p', 'muted', 'No policy decision was recorded for this payload.'));
        } else {
          const table = document.createElement('table');
          table.innerHTML =
            '<thead><tr><th>action</th><th>target</th><th>path</th><th>reason</th><th>confidence</th></tr></thead>';
          const tbody = document.createElement('tbody');
          for (const event of result.events) {
            const tr = document.createElement('tr');
            const cells = [
              event.action,
              event.kind === 'element' ? '<' + event.target + '>' : event.target + ' on <' + event.on + '>',
              event.path,
              event.reason + (event.policyKey ? ' (' + event.policyKey + ')' : ''),
              event.confidence,
            ];
            for (const [index, value] of cells.entries()) {
              const td = el('td', index === 0 || index === 1 || index === 2 ? 'mono' : '');
              if (index === 4) {
                const tag = el('span', 'tag ' + value, value);
                td.appendChild(tag);
              } else {
                td.textContent = value;
              }
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
          table.appendChild(tbody);
          eventsPanel.appendChild(table);
        }
        content.appendChild(eventsPanel);

        const findingsPanel = el('div', 'panel');
        findingsPanel.appendChild(el('h2', '', `residual risk scan (${result.findings.length})`));
        if (result.findings.length === 0) {
          findingsPanel.appendChild(el('p', 'muted', 'No residual sinks found in the output.'));
        } else {
          const table = document.createElement('table');
          table.innerHTML = '<thead><tr><th>severity</th><th>code</th><th>evidence</th><th>note</th></tr></thead>';
          const tbody = document.createElement('tbody');
          for (const finding of result.findings) {
            const tr = document.createElement('tr');
            const sev = el('td');
            sev.appendChild(el('span', 'tag ' + finding.severity, finding.severity));
            tr.appendChild(sev);
            tr.appendChild(el('td', 'mono', finding.code));
            tr.appendChild(el('td', 'mono', finding.evidence));
            tr.appendChild(el('td', '', finding.note));
            tbody.appendChild(tr);
          }
          table.appendChild(tbody);
          findingsPanel.appendChild(table);
        }
        content.appendChild(findingsPanel);
      }

      document.getElementById('search').oninput = (event) => renderList(event.target.value);
      renderList('');
      renderContent();
    </script>
  </body>
</html>
