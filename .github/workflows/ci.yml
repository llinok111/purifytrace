name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: output-equality against plain DOMPurify
        run: npm run verify:equivalence
      - name: corpus regression
        run: npm run corpus
      - name: check the corpus report is unchanged
        run: git diff --exit-code docs/corpus-report.json
      - name: demo build
        run: npm run demo
      - name: check the demo is unchanged
        run: git diff --exit-code demo

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm pack
      - name: install the tarball in a clean project and use it (ESM)
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/purifytrace-*.tgz jsdom >/dev/null
          cat > smoke.mjs <<'EOF'
          import createDOMPurify from 'dompurify';
          import { JSDOM } from 'jsdom';
          import { createAuditedSanitizer } from 'purifytrace';

          const window = new JSDOM('').window;
          const sanitizer = createAuditedSanitizer({ createDOMPurify, window });
          const { trail } = sanitizer.audit('<img src=x onerror=alert(1)>');
          if (trail.events.length !== 1) throw new Error('expected one event');
          if (trail.events[0].target !== 'onerror') throw new Error('wrong target');
          if (trail.events[0].reason.confidence !== 'confirmed') throw new Error('wrong confidence');
          console.log('ESM tarball smoke test ok');
          EOF
          node smoke.mjs
      - name: install the tarball in a clean project and use it (CJS)
        run: |
          cd /tmp/consumer
          cat > smoke.cjs <<'EOF'
          // DOMPurify's CJS build auto-instantiates at load time and looks up
          // `window` with `typeof`. A `const window` declared later in the same
          // scope is in TDZ and `typeof` throws, so the DOM must exist first.
          const { JSDOM } = require('jsdom');
          const window = new JSDOM('').window;
          const createDOMPurify = require('dompurify');
          const { createAuditedSanitizer } = require('purifytrace');

          const sanitizer = createAuditedSanitizer({ createDOMPurify, window });
          const { trail } = sanitizer.audit('<img src=x onerror=alert(1)>');
          if (trail.events.length !== 1) throw new Error('expected one event');
          if (trail.events[0].target !== 'onerror') throw new Error('wrong target');
          console.log('CJS tarball smoke test ok');
          EOF
          node smoke.cjs
      - name: the CLI works from the installed tarball
        run: |
          cd /tmp/consumer
          printf '<img src=x onerror=alert(1)>' > payload.html
          npx --no-install purifytrace payload.html --format json | head -5
